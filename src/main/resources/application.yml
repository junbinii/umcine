spring:
  application:
    name: umc-movie
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:umc_movie}?connectionTimeZone=Asia/Seoul
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: 8080
app:
  cors:
    enabled: ${APP_CORS_ENABLED:true}
    allowed-origin: http://localhost:5173
